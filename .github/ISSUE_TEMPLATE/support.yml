name: Question or problem
description: Ask about TimeTraveler or report a problem.
body:
  - type: markdown
    attributes:
      value: Everything you write here is public, so leave out personal details.
  - type: textarea
    id: question
    attributes:
      label: What's your question, or what happened?
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 16, iOS 26.1
  - type: input
    id: version
    attributes:
      label: TimeTraveler version
      description: Tap the gear, then the info button, and look under What's New.
      placeholder: 1.0 (1)
